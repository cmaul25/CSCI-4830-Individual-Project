{% block content %}
<!-- Section 1: Grid -->
<div style="display: flex; justify-content: center; margin-bottom: 10px; overflow: auto;">    <div id="grid-container" style="transform-origin: top left; transition: transform 0.1s;">
        <table style="border-collapse: collapse; cursor: pointer;">
            {% for row in grid %}
            <tr>
                {% for pixel in row %}
                <td style="width:8px; height:8px; background-color:{{ pixel.color }}; border: 1px solid #ccc; box-sizing: border-box; padding: 0;"
                    data-x="{{ pixel.x }}" data-y="{{ pixel.y }}"
                    data-changed-by="{{ pixel.changed_by }}"
                    data-timestamp="{{ pixel.timestamp }}"
                    onclick="pixelClicked(this)">
                </td>
                {% endfor %}
            </tr>
            {% endfor %}
        </table>
    </div>
</div>

<!-- Section 2: Signature -->
<div>
    <label>Signature:</label>
    <input type="text" id="signature" placeholder="Username..." style="width: 80px; padding: 3px;">
    <span id="signature-warning" style="color: red; display: none;">Required!</span>
</div>

<!-- Section 3: Color Widget -->
<div id="color-widget" style="padding: 8px; background-color: #f0f0f0; display: none; display: flex; flex-direction: row; align-items: center; gap: 15px; flex-wrap: wrap;">
    
    <div>
        <strong>Pixel:</strong> X: <span id="pixel-x">-</span>, Y: <span id="pixel-y">-</span>
    </div>
    
    <div>
        <strong>Last changed by:</strong> <span id="last-changed-by">-</span> <strong>at</strong> <span id="last-changed-time">-</span>
    </div>

    <div style="width: 100%; height: 0;"></div>
    
    <div style="display: flex; align-items: center; gap: 5px;">
        <label>R:</label>
        <input type="range" id="r-slider" min="0" max="255" value="128" oninput="updatePreview()" style="width: 80px;">
        <span id="r-value">128</span>
    </div>

    <div style="display: flex; align-items: center; gap: 5px;">
        <label>G:</label>
        <input type="range" id="g-slider" min="0" max="255" value="128" oninput="updatePreview()" style="width: 80px;">
        <span id="g-value">128</span>
    </div>

    <div style="display: flex; align-items: center; gap: 5px;">
        <label>B:</label>
        <input type="range" id="b-slider" min="0" max="255" value="128" oninput="updatePreview()" style="width: 80px;">
        <span id="b-value">128</span>
    </div>

    <div style="display: flex; align-items: center; gap: 5px;">
        <strong>Preview:</strong>
        <div id="color-preview" style="width: 30px; height: 30px; background-color: rgb(128,128,128); border: 1px solid #000;"></div>
    </div>

    <button onclick="submitPixel()">Submit</button>

</div>

<script>
    function pixelClicked(td) {
        const signature = document.getElementById('signature').value.trim();
        if (!signature) {
            document.getElementById('signature-warning').style.display = 'inline';
            return;
        }
        document.getElementById('signature-warning').style.display = 'none';

        const x = td.getAttribute('data-x');
        const y = td.getAttribute('data-y');
        const changedBy = td.getAttribute('data-changed-by') || 'Never changed';
        const timestamp = td.getAttribute('data-timestamp') || '-';

        document.getElementById('pixel-x').innerText = x;
        document.getElementById('pixel-y').innerText = y;
        document.getElementById('last-changed-by').innerText = changedBy;
        document.getElementById('last-changed-time').innerText = timestamp;
        document.getElementById('color-widget').style.display = 'flex';
        updatePreview();
    }

    function updatePreview() {
        const r = document.getElementById('r-slider').value;
        const g = document.getElementById('g-slider').value;
        const b = document.getElementById('b-slider').value;
        document.getElementById('r-value').innerText = r;
        document.getElementById('g-value').innerText = g;
        document.getElementById('b-value').innerText = b;
        document.getElementById('color-preview').style.backgroundColor = `rgb(${r},${g},${b})`;
    }

    function submitPixel() {
        const signature = document.getElementById('signature').value.trim();
        const x = document.getElementById('pixel-x').innerText;
        const y = document.getElementById('pixel-y').innerText;
        const r = document.getElementById('r-slider').value;
        const g = document.getElementById('g-slider').value;
        const b = document.getElementById('b-slider').value;
        const hex = '#' + [r, g, b].map(v => parseInt(v).toString(16).padStart(2, '0')).join('');

        fetch('/update_pixel/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': '{{ csrf_token }}'
            },
            body: JSON.stringify({ x, y, color: hex, signature })
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                // Update the pixel color on the grid visually
                const td = document.querySelector(`td[data-x="${x}"][data-y="${y}"]`);
                td.style.backgroundColor = hex;
                document.getElementById('color-widget').style.display = 'none';
            }
        });
    }

    document.getElementById('grid-container').addEventListener('wheel', function(e) {
        e.preventDefault();
        applyZoom(e);
    }, { passive: false });
</script>
{% endblock %}

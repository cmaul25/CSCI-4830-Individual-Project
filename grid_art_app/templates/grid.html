{% block content %}

<!-- Section 2: Grid -->
<div style="display: flex; justify-content: center; margin-bottom: 10px; overflow: auto;">
    <canvas id="grid-canvas" style="border: 1px solid #ccc; cursor: crosshair;"></canvas>
</div>

<!-- Section 3: Color Widget -->
<div id="color-widget" style="padding: 8px; background-color: #f0f0f0; display: none; flex-direction: row; align-items: center; gap: 15px; flex-wrap: wrap;">

    <div>
        <strong>Pixel:</strong> X: <span id="pixel-x">-</span>, Y: <span id="pixel-y">-</span>
    </div>

    <div>
        <strong>Last changed by:</strong> <span id="last-changed-by">-</span> <strong>at</strong> <span id="last-changed-time">-</span>
    </div>

    <div style="width: 100%; height: 0;"></div>

    <div>
        <label>Signature:</label>
        <input type="text" id="signature" placeholder="Username..." style="width: 80px; padding: 3px;">
        <span id="signature-warning" style="color: red; display: none;">Required!</span>
    </div>

    <div style="display: flex; align-items: center; gap: 5px;">
        <label>R:</label>
        <input type="range" id="r-slider" min="0" max="255" value="128" oninput="updatePreview()" style="width: 80px;">
        <span id="r-value">128</span>
    </div>

    <div style="display: flex; align-items: center; gap: 5px;">
        <label>G:</label>
        <input type="range" id="g-slider" min="0" max="255" value="128" oninput="updatePreview()" style="width: 80px;">
        <span id="g-value">128</span>
    </div>

    <div style="display: flex; align-items: center; gap: 5px;">
        <label>B:</label>
        <input type="range" id="b-slider" min="0" max="255" value="128" oninput="updatePreview()" style="width: 80px;">
        <span id="b-value">128</span>
    </div>

    <div style="display: flex; align-items: center; gap: 5px;">
        <strong>Preview:</strong>
        <div id="color-preview" style="width: 30px; height: 30px; background-color: rgb(128,128,128); border: 1px solid #000;"></div>
    </div>

    <button onclick="submitPixel()">Submit</button>

</div>

<!-- Section 4: Signature Search -->
<div style="padding: 8px; background-color: #e8e8e8; display: flex; align-items: center; gap: 10px;">
    <strong>Search Signature:</strong>
    <input type="text" id="search-signature" placeholder="Enter username..." style="padding: 3px; width: 120px;">
    <button onclick="searchSignature()">Search</button>
    <button onclick="clearSearch()">Clear</button>
    <span id="search-result" style="color: gray;"></span>
</div>

<script>
    const PIXEL_SIZE = 8;
    const WIDTH = 150;
    const HEIGHT = 100;

    // Build pixel map from Django data
    const pixelData = {{ pixel_data|safe }};
    const pixelMap = {};
    pixelData.forEach(p => {
        pixelMap[`${p.x},${p.y}`] = p;
    });

    //
    let selectedPixel = null;

    // Set up canvas
    const canvas = document.getElementById('grid-canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = WIDTH * PIXEL_SIZE;
    canvas.height = HEIGHT * PIXEL_SIZE;

    // Draw the full grid
    function drawGrid() {
        for (let y = 0; y < HEIGHT; y++) {
            for (let x = 0; x < WIDTH; x++) {
                const key = `${x},${y}`;
                const color = pixelMap[key] ? pixelMap[key].color : '#FFFFFF';
                ctx.fillStyle = color;
                ctx.fillRect(x * PIXEL_SIZE, y * PIXEL_SIZE, PIXEL_SIZE, PIXEL_SIZE);
                ctx.strokeStyle = '#ccc';
                ctx.strokeRect(x * PIXEL_SIZE, y * PIXEL_SIZE, PIXEL_SIZE, PIXEL_SIZE);
            }
        }
    }

    drawGrid();

    // Handle canvas click
    canvas.addEventListener('click', function(e) {
        const rect = canvas.getBoundingClientRect();
        const x = Math.floor((e.clientX - rect.left) / PIXEL_SIZE);
        const y = Math.floor((e.clientY - rect.top) / PIXEL_SIZE);

        if (x < 0 || x >= WIDTH || y < 0 || y >= HEIGHT) return;

        const key = `${x},${y}`;
        const info = pixelMap[key];

        document.getElementById('pixel-x').innerText = x;
        document.getElementById('pixel-y').innerText = y;
        document.getElementById('last-changed-by').innerText = info ? info.changed_by : 'Never changed';
        document.getElementById('last-changed-time').innerText = info ? info.timestamp : '-';
        document.getElementById('color-widget').style.display = 'flex';
        updatePreview();

        // Restore previously selected pixel
        if (selectedPixel) {
            const prevKey = `${selectedPixel.x},${selectedPixel.y}`;
            const prevColor = pixelMap[prevKey] ? pixelMap[prevKey].color : '#FFFFFF';
            ctx.fillStyle = prevColor;
            ctx.fillRect(selectedPixel.x * PIXEL_SIZE, selectedPixel.y * PIXEL_SIZE, PIXEL_SIZE, PIXEL_SIZE);
            ctx.strokeStyle = '#ccc';
            ctx.lineWidth = 1;
            ctx.strokeRect(selectedPixel.x * PIXEL_SIZE, selectedPixel.y * PIXEL_SIZE, PIXEL_SIZE, PIXEL_SIZE);
        }

        // Highlight new selected pixel in red
        ctx.fillStyle = 'red';
        ctx.fillRect(x * PIXEL_SIZE, y * PIXEL_SIZE, PIXEL_SIZE, PIXEL_SIZE);
        ctx.strokeStyle = '#ccc';
        ctx.lineWidth = 1;
        ctx.strokeRect(x * PIXEL_SIZE, y * PIXEL_SIZE, PIXEL_SIZE, PIXEL_SIZE);

        selectedPixel = { x, y };
    });

    function updatePreview() {
        const r = document.getElementById('r-slider').value;
        const g = document.getElementById('g-slider').value;
        const b = document.getElementById('b-slider').value;
        document.getElementById('r-value').innerText = r;
        document.getElementById('g-value').innerText = g;
        document.getElementById('b-value').innerText = b;
        document.getElementById('color-preview').style.backgroundColor = `rgb(${r},${g},${b})`;
    }

    function submitPixel() {
        const signature = document.getElementById('signature').value.trim();
        if (!signature) {
            document.getElementById('signature-warning').style.display = 'inline';
            return;
        }
        document.getElementById('signature-warning').style.display = 'none';

        const x = parseInt(document.getElementById('pixel-x').innerText);
        const y = parseInt(document.getElementById('pixel-y').innerText);
        const r = document.getElementById('r-slider').value;
        const g = document.getElementById('g-slider').value;
        const b = document.getElementById('b-slider').value;
        const hex = '#' + [r, g, b].map(v => parseInt(v).toString(16).padStart(2, '0')).join('');

        fetch('/update_pixel/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': '{{ csrf_token }}'
            },
            body: JSON.stringify({ x, y, color: hex, signature })
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                // Update pixel map
                const key = `${x},${y}`;
                pixelMap[key] = { x, y, color: hex, changed_by: signature, timestamp: new Date().toLocaleString() };

                // Redraw just the updated pixel
                ctx.fillStyle = hex;
                ctx.fillRect(x * PIXEL_SIZE, y * PIXEL_SIZE, PIXEL_SIZE, PIXEL_SIZE);
                ctx.strokeStyle = '#ccc';
                ctx.strokeRect(x * PIXEL_SIZE, y * PIXEL_SIZE, PIXEL_SIZE, PIXEL_SIZE);
                selectedPixel = null;
                document.getElementById('color-widget').style.display = 'none';
            }
        });
    }

    // Search functions
    let highlightedPixels = [];

    function searchSignature() {
        clearSearch();
        const query = document.getElementById('search-signature').value.trim().toLowerCase();
        if (!query) return;

        let count = 0;
        Object.values(pixelMap).forEach(p => {
            if (p.changed_by && p.changed_by.toLowerCase() === query) {
                highlightedPixels.push({ x: p.x, y: p.y });
                ctx.strokeStyle = 'yellow';
                ctx.lineWidth = 2;
                ctx.strokeRect(p.x * PIXEL_SIZE + 1, p.y * PIXEL_SIZE + 1, PIXEL_SIZE - 2, PIXEL_SIZE - 2);
                count++;
            }
        });

        document.getElementById('search-result').innerText = count > 0 ? `${count} pixels found` : 'No pixels found';
    }

    function clearSearch() {
        highlightedPixels.forEach(p => {
            const key = `${p.x},${p.y}`;
            const color = pixelMap[key] ? pixelMap[key].color : '#FFFFFF';
            ctx.fillStyle = color;
            ctx.fillRect(p.x * PIXEL_SIZE, p.y * PIXEL_SIZE, PIXEL_SIZE, PIXEL_SIZE);
            ctx.strokeStyle = '#ccc';
            ctx.lineWidth = 1;
            ctx.strokeRect(p.x * PIXEL_SIZE, p.y * PIXEL_SIZE, PIXEL_SIZE, PIXEL_SIZE);
        });
        highlightedPixels = [];
        document.getElementById('search-result').innerText = '';
    }
</script>

{% endblock %}
